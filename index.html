<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResizePack - Bulk Resize & Compress Images (Free ZIP)</title>
    <meta
      name="description"
      content="ResizePack lets you resize and compress many images at once. Presets for Etsy listings, web, and custom sizes. Process in-browser and download one ZIP."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#211c16" />
    <link rel="canonical" href="https://www.resizepack.tech/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking render: fetch as a preload, then promote to
         a stylesheet on load. display=swap means text shows immediately in a
         fallback and swaps in when the webfont arrives (cuts ~2s render-block). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <meta property="og:site_name" content="ResizePack" />
    <meta property="og:title" content="ResizePack - Bulk Resize & Compress Images" />
    <meta
      property="og:description"
      content="Bulk image optimizer for Etsy listings, websites, and blogs. Drop images, choose a preset, download one ZIP."

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta

    />
    <meta name="twitter:image" content="https://www.resizepack.tech/og.png" />
