name: Keep API warm

# Render's free tier spins the API down after ~15 min idle, so a returning
# Pro user hits a 30-50s cold start on their first plan check. This pings the
# public /health endpoint on a schedule so the service stays awake.
#
# Notes:
# - GitHub cron is best-effort and can lag under load, so we ping every 10 min
#   to stay comfortably inside the 15-min sleep window even if a run slips.
# - Override the URL without editing this file by setting a repo variable
#   named API_URL (Settings -> Secrets and variables -> Actions -> Variables).
# - /health is public and returns only {"ok":true} — no secrets involved.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# A slow cold start shouldn't pile up overlapping runs.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="${{ vars.API_URL || 'https://resizepack-api.onrender.com' }}"
          echo "Pinging $URL/health"
          # Wait up to 60s so a cold start counts as success (it woke the service).
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$URL/health" || true)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Health check did not return 200 (got '$code')."
            exit 1
          fi
